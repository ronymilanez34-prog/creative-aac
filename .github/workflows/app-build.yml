# Builds the app without needing Flutter on anyone's computer:
#  • analyzes the Dart code (this is our CI "compiler"),
#  • builds an installable Android APK (download from the run's Artifacts),
#  • builds the web version and — on main or a manual run — publishes it to
#    GitHub Pages, so any tablet just opens a link.
#
# Optional repo secrets (Settings → Secrets and variables → Actions):
#   COMPANION_ENDPOINT — the companionTurnHttp URL (empty = offline demo)
#   COMPANION_APP_KEY  — the APP_KEY shared secret
# Note: values baked into a public web build are extractable by anyone who
# digs; fine for a closed pilot — set a spend limit on the Anthropic account.

name: Build app

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Platform folders are deliberately not committed — generate them fresh.
      - name: Generate platform folders
        run: flutter create . --platforms android,web

      # Invented-language words carry the creator's own recorded voice —
      # the freshly generated manifest needs the microphone permission the
      # `record` plugin requires (the web asks at runtime; Android can't).
      - name: Allow microphone on Android (recorded words)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO android/app/src/main/AndroidManifest.xml

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build Android APK
        run: >
          flutter build apk --release
          --dart-define=COMPANION_ENDPOINT=${{ secrets.COMPANION_ENDPOINT }}
          --dart-define=COMPANION_APP_KEY=${{ secrets.COMPANION_APP_KEY }}
          --dart-define=BUILD_STAMP=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: creative-aac-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Build web
        run: >
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"
          --dart-define=COMPANION_ENDPOINT=${{ secrets.COMPANION_ENDPOINT }}
          --dart-define=COMPANION_APP_KEY=${{ secrets.COMPANION_APP_KEY }}
          --dart-define=BUILD_STAMP=${{ github.run_number }}

      # Flutter's service worker keeps serving the previous build until the
      # tab is fully closed and reopened — pilot testers were stuck on old
      # versions. When the NEW worker takes control shortly after page load,
      # reload once automatically; a takeover later (mid-session, possibly
      # mid-creation) changes nothing until the next visit.
      - name: Auto-refresh when a new version arrives
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          p = Path('build/web/index.html')
          s = p.read_text()
          snippet = (
            '<script>\n'
            'if ("serviceWorker" in navigator) {\n'
            '  var t0 = Date.now(); var reloaded = false;\n'
            '  navigator.serviceWorker.addEventListener("controllerchange", function () {\n'
            '    if (!reloaded && Date.now() - t0 < 15000) { reloaded = true; location.reload(); }\n'
            '  });\n'
            '}\n'
            '</script>\n</body>'
          )
          assert '</body>' in s
          p.write_text(s.replace('</body>', snippet))
          print('auto-refresh snippet injected')
          EOF

      - name: Upload web build for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    # Publishes the web build. Runs on main, or when triggered manually from
    # the Actions tab (any branch). Requires Settings → Pages → Source:
    # "GitHub Actions" to be enabled once.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
